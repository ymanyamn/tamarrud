<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مدرسة بدر الدين الغزال</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; direction: rtl; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .logo { width: 160px; margin: 20px auto; border-radius: 12px; box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); }
    h1 { color: #ff9800; margin-bottom: 5px; }
    p { color: #ccc; margin-bottom: 30px; }
    .btn { display: block; margin: 10px auto; padding: 14px 24px; background: linear-gradient(to right, #ff9800, #f57c00); color: #212121; font-weight: bold; text-decoration: none; border-radius: 8px; width: 80%; max-width: 300px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 6px; border: none; background: #333; color: #fff; }
    button { background: linear-gradient(to right, #ff9800, #f57c00); color: #212121; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #222; }
    th, td { border: 1px solid #555; padding: 8px; color: #fff; }
    .section { display: none; margin-top: 30px; padding: 20px; border: 1px solid #444; border-radius: 10px; background: #1e1e1e; }
  </style>
</head>
<body>

  <img src="https://i.ibb.co/KpdJjYwq/logo.jpg" class="logo" alt="شعار المدرسة">
  <h1>مدرسة بدر الدين الغزال</h1>
  <p>نظام المعلومات وإدارة المدرسة</p>

  <button class="btn" onclick="showSection('parent')">👨‍👩‍👧‍👦 دخول ولي الأمر</button>
  <button class="btn" onclick="askPassword('teacher')">👨‍🏫 دخول معلم</button>
  <button class="btn" onclick="askPassword('admin')">🧑‍💼 دخول مدير</button>

  <!-- ولي الأمر -->
  <div id="parent" class="section">
    <h2>استعلام ولي الأمر</h2>
    <input id="searchName" placeholder="اسم الطالب">
    <input id="searchClass" placeholder="الصف">
    <button onclick="searchStudent()">🔍 بحث</button>
    <div id="result"></div>
  </div>

  <!-- المعلم -->
  <div id="teacher" class="section">
    <h2>إدخال بيانات الطالب</h2>
    <input id="name" placeholder="اسم الطالب">
    <input id="class" placeholder="الصف">
    <input id="group" placeholder="الشعبة">
    <input id="subject" placeholder="المادة">
    <input id="absence" placeholder="غياب">
    <input id="delay" placeholder="تأخر">
    <input id="homework" placeholder="وظائف">
    <input id="quiz" placeholder="مذاكرة">
    <input id="exam" placeholder="امتحان">
    <input id="date" placeholder="تاريخ">
    <button onclick="saveData()">💾 حفظ</button>
  </div>

  <!-- المدير -->
  <div id="admin" class="section">
    <h2>لوحة المدير</h2>
    <button onclick="loadData()">🔄 تحديث البيانات</button>
    <div id="adminData"></div>
  </div>

  <script>
    const apiURL = "https://sheetdb.io/api/v1/6534bwnl5o7sl";
    const passwords = { teacher: "1990", admin: "1992" };

    function askPassword(role) {
      const input = prompt("أدخل كلمة المرور:");
      if (input === passwords[role]) {
        showSection(role);
        if (role === "admin") loadData();
      } else {
        alert("❌ كلمة المرور غير صحيحة");
      }
    }

    function showSection(id) {
      document.querySelectorAll(".section").forEach(s => s.style.display = "none");
      document.getElementById(id).style.display = "block";
    }

    function saveData() {
      const student = {
        name: val("name"), class: val("class"), group: val("group"),
        subject: val("subject"), absence: val("absence"), delay: val("delay"),
        homework: val("homework"), quiz: val("quiz"), exam: val("exam"), date: val("date")
      };
      fetch(apiURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: student })
      }).then(() => alert("✅ تم الحفظ"));
    }

    function searchStudent() {
      const name = val("searchName");
      const className = val("searchClass");
      fetch(apiURL).then(res => res.json()).then(data => {
        const filtered = data.filter(s => s.name === name && s.class === className);
        const resultDiv = document.getElementById("result");
        if (filtered.length === 0) {
          resultDiv.innerHTML = "<p>❌ لا يوجد بيانات</p>";
          return;
        }
        let html = `<table><tr><th>المادة</th><th>غياب</th><th>تأخر</th><th>وظائف</th><th>مذاكرة</th><th>امتحان</th><th>تاريخ</th></tr>`;
        filtered.forEach(s => {
          html += `<tr>
            <td>${s.subject}</td><td>${s.absence}</td><td>${s.delay}</td>
            <td>${s.homework}</td><td>${s.quiz}</td><td>${s.exam}</td><td>${s.date}</td>
          </tr>`;
        });
        html += `</table>`;
        resultDiv.innerHTML = html;
      });
    }

    function loadData() {
      fetch(apiURL).then(res => res.json()).then(data => {
        let html = `<table><tr><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>المادة</th><th>غياب</th><th>تأخر</th><th>وظائف</th><th>مذاكرة</th><th>امتحان</th><th>تاريخ</th><th>حذف</th></tr>`;
        data.forEach(s => {
          html += `<tr>
            <td>${s.name}</td><td>${s.class}</td><td>${s.group}</td><td>${s.subject}</td>
            <td>${s.absence}</td><td>${s.delay}</td><td>${s.homework}</td><td>${s.quiz}</td><td>${s.exam}</td><td>${s.date}</td>
            <td><button onclick="deleteRow(${s.id})">🗑️</button></td>
          </tr>`;
        });
        html += `</table>`;
        document.getElementById("adminData").innerHTML = html;
      });
    }

    function deleteRow(id) {
      if (confirm("هل تريد حذف هذا السطر؟")) {
        fetch(`${apiURL}/id/${id}`, { method: "DELETE" }).then(() => loadData());
      }
    }

    function val(id) {
      return document.getElementById(id).value.trim();
    }
  </script>
</body>
</html>
